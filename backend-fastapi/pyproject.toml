[project]
name = "ai-app-tester-api"
version = "0.1.0"
description = "Scan engine for the AI App Tester: Playwright for evidence, Claude for judgement."
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Embedded JavaScript and user-facing copy read better unwrapped.
"app/scanner/browser.py" = ["E501"]
"app/scanner/findings.py" = ["E501"]
